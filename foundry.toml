[profile.default]
src = "contracts/8"
out = "artifacts"
test = "src/tests/transferMode"

libs = ["node_modules", "lib"]
optimizer = true
optimizer_runs = 200
# via_ir = true

# CREATE2 deployer used for `new X{salt:...}()` in forge scripts (overrides the
# default 0x4e59b44847b379578588920cA78FbF26c0B4956C). Must exist on each target chain.
# create2_deployer = "0xFaC897544659Fb136C064d5428947f5BC9cC1Fa2" (this is okx owner deployed)
remappings = [
    "@ensdomains/=node_modules/@ensdomains/",
    "@openzeppelin/=node_modules/@openzeppelin/",
    "eth-gas-reporter/=node_modules/eth-gas-reporter/",
    "hardhat/=node_modules/hardhat/",
    "@dex/=contracts/8/",
    "@dex-exactout/=contracts/exactout/"
]

evm_version = "london"
fs_permissions = [{access = "read-write", path = "./"}]

[profile.default.zksync]
compile = true                          # Enable zkEVM compilation
startup = true                          # Auto switch to zkEVM environment on startup
zksolc = "1.5.10"                       # zksolc version (avoid 1.5.9 due to bugs)
fallback_oz = true                      # Fallback to -Oz optimization when contract is too large
optimizer = true                        # Enable optimizer
optimizer_mode = "z"                    # Optimization mode: 3 (performance) | s (size) | z (max size reduction)
# suppressed_errors = ["sendtransfer"]    # Suppress transfer/send errors (ZKsync-specific)

[lint]
# disable all lint checks, avoid too many note warnings when building
ignore = ["**/*"]

# Sourcify verification settings for Monad
metadata = true
metadata_hash = "none"
use_literal_content = true

# RPC URLs are sourced from environment variables (.env), not hardcoded here.
# Each value is the full node URL including any provider key. See .env.sample.
[rpc_endpoints]
arb = "${ARB_RPC_URL}"
avax = "${AVAX_RPC_URL}"
base = "${BASE_RPC_URL}"
bsc = "${BSC_RPC_URL}"
conflux = "${CONFLUX_RPC_URL}"
cro = "${CRO_RPC_URL}"
eth = "${ETH_RPC_URL}"
ethw = "${ETHW_RPC_URL}"
flare = "${FLARE_RPC_URL}"
ftm = "${FTM_RPC_URL}"
linea = "${LINEA_RPC_URL}"
mantle = "${MANTLE_RPC_URL}"
okc = "${OKC_RPC_URL}"
op = "${OP_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
polyzkevm = "${POLYZKEVM_RPC_URL}"
scroll = "${SCROLL_RPC_URL}"
xlayer = "${XLAYER_RPC_URL}"
sonic = "${SONIC_RPC_URL}"
unichain = "${UNICHAIN_RPC_URL}"
monad = "${MONAD_RPC_URL}"
katana = "${KATANA_RPC_URL}"
hyperevm = "${HYPEREVM_RPC_URL}"
pharos = "${PHAROS_RPC_URL}"
manta = "${MANTA_RPC_URL}"
mode = "${MODE_RPC_URL}"
zeta = "${ZETA_RPC_URL}"
metis = "${METIS_RPC_URL}"
merlin = "${MERLIN_RPC_URL}"
blast = "${BLAST_RPC_URL}"
sei = "${SEI_RPC_URL}"
apechain = "${APECHAIN_RPC_URL}"
iotex = "${IOTEX_RPC_URL}"
plasma = "${PLASMA_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
style = "space"
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "preserve"
hex_underscore = "remove"
single_line_statement_blocks = "preserve"
override_spacing = true
wrap_comments = false
docs_style = "preserve"
ignore = []
contract_new_lines = false
sort_imports = true
pow_no_space = true
call_compact_args = true

[profile.security-manager]
src = "contracts/8"
out = "artifacts"
test = "src/tests/security-manager"
libs = ["node_modules", "lib"]
optimizer = true
optimizer_runs = 1
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@dex/=contracts/8/",
]
evm_version = "london"
fs_permissions = [{access = "read-write", path = "./"}]
